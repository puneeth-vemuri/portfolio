name: Refresh dependency lockfile

on:
  push:
    branches:
      - audit/security-seo-baseline
    paths:
      - .github/workflows/refresh-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: audit/security-seo-baseline
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install current dependencies
        run: npm ci
      - name: Apply non-breaking security updates
        run: npm audit fix
      - name: Verify refreshed lockfile install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Commit refreshed lockfile
        if: always()
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh vulnerable dependency versions"
          git push origin HEAD:audit/security-seo-baseline
